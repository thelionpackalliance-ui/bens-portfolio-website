<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%"><defs><linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#D4D4D4"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><clipPath id="box-clip"><rect width="512" height="512"/></clipPath><style>@keyframes borderPulse { 0%, 100% { stroke-opacity: 0.25; } 50% { stroke-opacity: 0.95; } } @keyframes textGlow { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } } @keyframes flareSweep { 0% { transform: translateX(-400px) skewX(-25deg); } 40%, 100% { transform: translateX(800px) skewX(-25deg); } } .bg { fill: #000000; } .border { fill: none; stroke: #FFFFFF; stroke-width: 12; animation: borderPulse 2.5s infinite ease-in-out; } .letter { font-family: 'Georgia', 'Didot', serif; font-weight: 700; font-size: 350px; fill: url(#shimmer); text-anchor: middle; dominant-baseline: central; transform-origin: center; animation: textGlow 2.5s infinite ease-in-out; } .flare { fill: #FFFFFF; opacity: 0.35; animation: flareSweep 3.5s infinite ease-in-out; }</style></defs><rect class="bg" width="512" height="512"/><g clip-path="url(#box-clip)"><rect class="flare" x="0" y="-50" width="120" height="650"/></g><rect class="border" x="12" y="12" width="488" height="488"/><text class="letter" x="256" y="276">B</text></svg>